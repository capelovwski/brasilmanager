const infStart = (budget) => Math.max(1, Math.min(14, 1 + Math.round(Math.log2(Math.max(1, budget / 3e6)) * 2.2)));
function infra() {
  if (!S.infra || S.infra.club !== S.userClubId) {
    const e = infStart(Core.userClub(S).budget);
    S.infra = { club: S.userClubId, lv: { ct: Math.max(1, e - 1), est: e, sede: Math.max(1, e - 1) }, obra: {}, last: null, lastGate: null, fresh: {} };
  }
  if (!S.infra.fresh) S.infra.fresh = {};
  return S.infra;
}
const infCost = (k, lv) => Math.round(150000 * Math.pow(1.45, lv - 1) * INF_META[k].f / 1e4) * 1e4; // do nivel lv para lv+1
const infDays = (lv) => 1 + Math.floor(lv / 3);
const infMaint = (k, lv) => Math.round(800 * Math.pow(lv, 1.55) * INF_META[k].f / 100) * 100;
const infMaintAll = () => { const I = infra(); return INF_KEYS.reduce((a, k) => a + infMaint(k, I.lv[k]), 0); };
const DIV_TICKET = { A: 60, B: 35, C: 25, D: 15 };
const infPrice = (lv, cup) => Math.round((DIV_TICKET[userDiv(S)] || 20) * (1 + .04 * (lv - 1)) * (cup ? 1.2 : 1));
function infCrowd(lv, cup) {
  const c = clubOf(S.userClubId), l5 = last5(), pts = l5.reduce((a, r) => a + (r === 'V' ? 3 : r === 'E' ? 1 : 0), 0);
  const form = .75 + .5 * (l5.length ? pts / (3 * l5.length) : .5);
  const t = userTable(S), n = t.length || 20, pos = t.findIndex((r) => isMe(r.clubId)) + 1 || Math.ceil(n / 2), band = Math.ceil(n * .2);
  const posF = pos <= band ? 1.15 : pos > n - band ? .9 : 1;
  const demand = 600 * Math.pow(1.09, (c.reputation || 40) - 25) * form * posF * (cup ? 1.4 : 1) * (1 + .05 * (lv - 1));
  const cap = EST_CAP[lv - 1], att = Math.round(Math.min(cap, demand) / 10) * 10;
  return { att, cap, demand: Math.round(demand), price: infPrice(lv, cup), gate: Math.round(att * infPrice(lv, cup)) };
}
const infCom = (lv) => Math.round(2.5 * Math.sqrt(Core.userClub(S).budget) * (lv - 1) / 100) * 100;
const infRec = (lv) => .12 * (lv - 1), infEvo = (lv) => Math.round(4 * (lv - 1));

function infTick(rd, f) {
  if (!S || S.round === rd) return;
  const I = infra(), fin = S.finance;
  let gate = 0, att = 0;
  if (f && f.result && isMe(f.homeId) && !f.neutral) { const g = infCrowd(I.lv.est, f.comp === 'CDB' || f.comp === 'LIB' || f.comp === 'SUL'); gate = g.gate; att = g.att; I.lastGate = { rd, gate, att, cap: g.cap, price: g.price, opp: f.awayId }; }
  const com = infCom(I.lv.sede), maint = infMaintAll();
  fin.balance += gate + com - maint; fin.income = (fin.income || 0) + gate + com; fin.expense = (fin.expense || 0) + maint;
  const h = fin.history[fin.history.length - 1]; if (h) h.balance = fin.balance;
  I.last = { rd, gate, att, com, maint };
  const lc = I.lv.ct;
  if (lc > 1) userSquad(S).forEach((p) => {
    p.fitness = Math.min(100, p.fitness + infRec(lc));
    p.xp = (p.xp || 0) + Math.max(0, p.potential - p.ovr) * .0004 * (lc - 1) * (p.age <= 23 ? 1.5 : p.age <= 29 ? 1 : .5);
    let up = false; while (p.xp >= 1 && p.ovr < p.potential) { p.ovr++; p.xp -= 1; up = true; } if (up) Core.refresh(p);
  });
  INF_KEYS.forEach((k) => {
    const o = I.obra[k]; if (!o) return;
    if (--o.left > 0) return;
    I.lv[k] = o.to; delete I.obra[k]; I.fresh[k] = o.to;
    const [t, d] = INF_META[k].info[o.to - 1];
    Core.pushMsg(S, { cat: 'clube', from: 'Engenharia', title: `${INF_META[k].name} nível ${o.to}: ${t}`, body: `Obra entregue. ${d}` });
  });
}
const playRound = (st) => {
  if (st.pre && !st.pre.done) st.pre.done = true; // bola rolando: acabou a pre-temporada
  const rd = st.round, f = (st.fixtures || []).find((x) => x.round === rd && (isMe(x.homeId) || isMe(x.awayId)));
  const out = corePlayRound(st);
  try { infTick(rd, f); } catch (e) { console.error(e); }
  try { contAdvance(); estAdvance(); } catch (e) { console.error(e); }
  try { jfPal(); } catch (e) { console.error(e); }
  try { scTick(); } catch (e) { console.error(e); }
  try { ccAfterRound(st); } catch (e) { console.error(e); }
  return out;
};

function infBuild(k) {
  const I = infra(), lv = I.lv[k];
  if (I.obra[k]) return say('Já tem obra em andamento aqui.');
  if (lv >= INF_MAX) return say('Já está no nível máximo.');
  const c = infCost(k, lv);
  if (S.finance.balance < c) return say(`Falta caixa: esta obra custa ${money(c)}.`);
  S.finance.balance -= c; const n = infDays(lv);
  I.obra[k] = { to: lv + 1, left: n, total: n }; infLook = null;
  say(`Obra iniciada: ${INF_META[k].info[lv][0]}. Pronta em ${n} data${n > 1 ? 's' : ''}.`);
}

function calMigrate() {
  if (!S || S.calV === 2) return;
  const old = S.round, wk = S.week && S.week.round === old;
  (S.fixtures || []).forEach((f) => { f.round = calNew(f.round); });
  S.round = old > 51 ? LAST_ROUND + 1 : calNew(old);
  if (wk) S.week.round = S.round;
  (S.messages || []).forEach((m) => { if (m.round) m.round = Math.min(LAST_ROUND, calNew(m.round)); });
  ((S.finance && S.finance.history) || []).forEach((h) => { if (h.round) h.round = calNew(h.round); });
  S.calV = 2;
}

function applyRealNames() {
  if (!S || !S.squads || S.realN === 2) return;
  S.realN = 2; let n = 0;
  const POS = ['GK', 'DEF', 'MID', 'ATT'];
  for (const id of Object.keys(REAL)) {
    const sq = S.squads[id]; if (!sq) continue;
    POS.forEach((pos, i) => {
      const slots = sq.filter((p) => p.pos === pos && p.id !== 'jf-1').sort((a, b) => b.ovr - a.ovr);
      REAL[id][i].forEach((nm, j) => { if (slots[j]) { slots[j].name = nm; n++; } });
    });
  }
  if (n) { try { save(); render(); } catch (e) {} }
}

.gs-top { position: absolute; bottom: 46px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; pointer-events: none; } .gs-old .trophy, .gs-old .crest { width: 30px; height: 30px; opacity: .85; }
.gs-mgr { position: absolute; left: 132px; bottom: 64px; width: 44px; height: 72px; }
.gm { position: absolute; inset: 0; display: block; } .gm svg { width: 44px; height: 72px; display: block; image-rendering: pixelated; }
.gs-tro { position: absolute; left: -6px; bottom: 76px; width: 56px; height: 56px; transform: translate(78px, 26px); }
.gs-tro .trophy, .gs-tro .crest { width: 56px; height: 56px; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.gm.f1, .gm.f2 { opacity: 0; } .gm.f3 { opacity: 1; }
.gs-sp { position: absolute; width: 6px; height: 6px; background: #fff3b0; left: 60px; bottom: 56px; opacity: 0; }
.gs-sp.a { margin: 0 0 0 20px; --dx: -26px; --dy: -34px; } .gs-sp.b { --dx: 34px; --dy: -40px; } .gs-sp.c { --dx: 52px; --dy: -10px; } .gs-sp.d { --dx: -4px; --dy: -52px; }
.gal.fresh .gs-body { animation: galBuild 1.1s steps(6, end) .2s backwards; }
.gal .gs-plq { animation: fade .3s 1.3s backwards; }
.gal .gs-mgr { animation: galWalk 2.1s linear 1.2s backwards; }
.gal .gm.f1 { animation: galStep .36s steps(1) 1.2s 6 backwards, galOff 0s 3.3s forwards; }
.gal .gm.f2 { animation: galStep2 .36s steps(1) 1.2s 6 backwards, galOff 0s 3.3s forwards; }
.gal .gm.f3 { animation: galOn 0s 3.3s backwards; }
.gal .gs-tro { animation: galPlace .7s ease-in-out 3.3s backwards; }
.gal .gs-sp { animation: galSpark .9s ease-out 4s backwards; } .gal .gs-sp.b { animation-delay: 4.1s; } .gal .gs-sp.c { animation-delay: 4.2s; } .gal .gs-sp.d { animation-delay: 4.05s; }
.gal-cap { text-align: center; font-size: 14px; opacity: .92; animation: fade .4s 4s backwards; } .gal-btns { display: flex; gap: 10px; width: 100%; animation: fade .4s 4.3s backwards; } .gal-btns .cc-btn { flex: 1; }
@keyframes galBuild { from { transform: scaleY(0); } to { transform: none; } }
@keyframes galWalk { from { transform: translateX(-170px); } to { transform: none; } }
@keyframes galStep { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
@keyframes galStep2 { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
@keyframes galOff { to { opacity: 0; } } @keyframes galOn { from { opacity: 0; } to { opacity: 1; } }
@keyframes galPlace { 0% { transform: translate(0, 0); } 40% { transform: translate(40px, -18px); } 100% { transform: translate(78px, 26px); } }
@keyframes galSpark { 0% { opacity: 0; transform: translate(0,0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
.gal-empty { padding: 24px 16px; text-align: center; } .gal-empty .ge-sign { display: inline-block; background: repeating-linear-gradient(45deg, #ffd24a 0 10px, #1d1606 10px 20px); color: #fff; padding: 6px 14px; border: 2px solid #1d1606; margin-bottom: 10px; text-shadow: 0 1px 0 #000; position: relative; z-index: 1; } .gal-empty p { color: #aab6c4; font-size: 13px; position: relative; z-index: 1; }

/* ===== v0.18: identidade por campeonato, mensagens, ajuda e acabamento 32 bits ===== */
.lvc { --lc-bg1: #0d1410; --lc-bg2: #13201a; --lc-acc: #9fe06a; --lc-ink: #eef3ea; --lc-soft: #16211a; --lc-mute: #9fb3a2; --lc-line: #3a4a3e; --lc-pat: none; }
.lvc-BR { --lc-bg1: #06210f; --lc-bg2: #0e3d1e; --lc-acc: #ffdf00; --lc-soft: #0f3a1d; --lc-mute: #a6d9b3; --lc-line: #1f6a35; --lc-pat: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 26px, transparent 26px 52px); }
.lvc-SA { --lc-acc: #ffdf00; } .lvc-SB { --lc-acc: #6fb0ff; } .lvc-SC { --lc-acc: #ff9a55; } .lvc-SD { --lc-acc: #c3a8ff; }
.lvc-CDB { --lc-bg1: #07152f; --lc-bg2: #0f2f68; --lc-acc: #d4af37; --lc-soft: #10264f; --lc-mute: #9fb0d0; --lc-line: #2c4675; --lc-pat: repeating-linear-gradient(135deg, rgba(212,175,55,.08) 0 2px, transparent 2px 14px); }
.lvc-LIB { --lc-bg1: #050505; --lc-bg2: #1d1d1d; --lc-acc: #e2b13c; --lc-soft: #171717; --lc-mute: #b9b2a0; --lc-line: #3a3a3a; --lc-pat: repeating-linear-gradient(135deg, rgba(226,177,60,.08) 0 2px, transparent 2px 14px); }
.lvc-SUL { --lc-bg1: #04212b; --lc-bg2: #0b4f6c; --lc-acc: #4fd1c5; --lc-soft: #0b3a4f; --lc-mute: #a8d8d2; --lc-line: #1d6b80; --lc-pat: repeating-linear-gradient(135deg, rgba(79,209,197,.08) 0 2px, transparent 2px 14px); }
.lvc-EST { --lc-bg1: #2a160a; --lc-bg2: #4d2c15; --lc-acc: #f4ead0; --lc-soft: #3a2210; --lc-mute: #dcc3a2; --lc-line: #74502c; --lc-pat: repeating-linear-gradient(0deg, rgba(255,226,190,.06) 0 3px, transparent 3px 8px); }

.live.lvc { background: var(--lc-pat), linear-gradient(180deg, var(--lc-bg1), var(--lc-bg2)); color: var(--lc-ink); }
.live.lvc .lv-clock { color: var(--lc-acc); } .live.lvc .lv-tag { color: var(--lc-mute); }
.live.lvc .lvb { background: var(--lc-soft); color: var(--lc-ink); border-color: var(--lc-bg1); }
.live.lvc .lv-ev { background: var(--lc-soft); border-left-color: var(--lc-acc); } .live.lvc .lv-ev .muted { color: var(--lc-mute); }
.live.lvc .pbar { background: var(--lc-line); } .live.lvc .pbar i { background: var(--lc-acc); }
.live.lvc .lv-stad { border-color: var(--lc-acc); border-bottom-color: color-mix(in srgb, var(--lc-acc) 55%, #000); }
.live.lvc .score { text-shadow: 0 0 14px color-mix(in srgb, var(--lc-acc) 55%, transparent); }
.live.lvc .lv-flash.on.h, .live.lvc .lv-flash.on.a { background: color-mix(in srgb, var(--lc-acc) 55%, transparent); }
.lvc-band { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; padding: 7px 10px; background: color-mix(in srgb, var(--lc-acc) 13%, transparent); border: 2px solid var(--lc-acc); box-shadow: 3px 3px 0 var(--lc-acc); }
.lvc-EST .lvc-band { border-left: 10px solid var(--lc-st, var(--lc-acc)); }
.lvc-band .crest { width: 32px; height: 32px; flex: none; filter: none !important; }
.lvc-band b { display: block; font-size: 12px; letter-spacing: .08em; color: var(--lc-acc); text-transform: uppercase; }
.lvc-band small { display: block; font-size: 11px; color: var(--lc-mute); margin-top: 2px; }

/* pre-jogo com a cara do campeonato */
.pm.lvc .pm-card { border-color: var(--lc-acc); }
.pm.lvc .pm-h { margin: -12px -14px 10px; padding: 10px 14px; background: var(--lc-pat), linear-gradient(90deg, var(--lc-bg1), var(--lc-bg2)); border-bottom: 3px solid var(--lc-acc); }

.mcard.m-SUL { background: linear-gradient(180deg, #04212b, #0b4f6c); color: #e6fbf8; border-color: #4fd1c5; } .mcard.m-SUL .lbl, .mcard.m-SUL .vs, .mcard.m-SUL .small { color: #4fd1c5; } .mcard.m-SUL .btn:not(.sec) { background: #4fd1c5; color: #04212b; border-color: #4fd1c5; } .mcard.m-SUL .btn.sec { color: #e6fbf8; border-color: #1d6b80; }
.mcard[class*="m-E_"] { background: linear-gradient(180deg, #2a160a, #4d2c15); color: #f4ead0; border-color: #c9a26b; } .mcard[class*="m-E_"] .lbl, .mcard[class*="m-E_"] .vs, .mcard[class*="m-E_"] .small { color: #f4ead0; } .mcard[class*="m-E_"] .btn:not(.sec) { background: #f4ead0; color: #2a160a; border-color: #f4ead0; } .mcard[class*="m-E_"] .btn.sec { color: #f4ead0; border-color: #74502c; }

/* iluminacao 32 bits no estadio: holofotes e sombra no gramado */
.lv-stad::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen; background: radial-gradient(90% 60% at 8% -12%, rgba(255,255,235,.30), transparent 60%), radial-gradient(90% 60% at 92% -12%, rgba(255,255,235,.30), transparent 60%); }

.lvc .lv-stad::before { background: radial-gradient(90% 60% at 8% -12%, color-mix(in srgb, var(--lc-acc) 38%, #fff) , transparent 60%), radial-gradient(90% 60% at 92% -12%, color-mix(in srgb, var(--lc-acc) 38%, #fff), transparent 60%); opacity: .34; }
.pitch .pl .sprite, .spr .sprite, .bn .sprite { filter: drop-shadow(0 2px 0 rgba(0,0,0,.32)); }

/* ajuda nas configuracoes */
.helpg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hl { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 11px 10px; text-align: left; font-size: 11px; min-width: 0; }
.hl b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hl span { color: var(--muted); }


/* ===== v0.19: estética de vila (pergaminho, madeira, luz quente) ===== */
:root { --bg: #efd9a0; --surface: #fbf0cf; --line: #c79a5c; --fg: #3b2412; --muted: #85603c; --soft: #ebd197; --accent: #2f6f9f; --on-accent: #ffffff; --good: #3f8a2e; --warn: #b87a0c; --bad: #b83a2a; --wood: #8b5a2b; --wood2: #5a3418; --pitch: #5a9a3e; --pitch2: #52903a; --paper: #f6e8c0; --ink: #3b2412; --paperline: #c9a86a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1e140d; --surface: #2d1f14; --line: #6a4a2c; --fg: #f6e6bd; --muted: #c1a37a; --soft: #3a281a; --good: #8fd16a; --warn: #f0bf55; --bad: #ff8d77; --wood: #6f4a28; --wood2: #3a2312; --paper: #3a2c1c; --ink: #f6e6bd; --paperline: #6a5330; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1e140d; --surface: #2d1f14; --line: #6a4a2c; --fg: #f6e6bd; --muted: #c1a37a; --soft: #3a281a; --good: #8fd16a; --warn: #f0bf55; --bad: #ff8d77; --wood: #6f4a28; --wood2: #3a2312; --paper: #3a2c1c; --ink: #f6e6bd; --paperline: #6a5330; color-scheme: dark; }
body { background-image: radial-gradient(rgba(120,70,20,.09) 1px, transparent 1.6px); background-size: 8px 8px; }
.card, .pick, .tile, .pc, .tk, .cand, .msg, .ach, .dc, .inv { border: 2px solid var(--wood); box-shadow: inset 0 2px 0 rgba(255,246,208,.5), inset 0 -3px 0 rgba(90,50,20,.16), 0 3px 0 var(--wood2); }
.card { border-radius: 2px; }
.top { border-bottom: 4px solid var(--wood); box-shadow: 0 3px 0 var(--wood2); }
.tabs { background: linear-gradient(180deg, #9a6a38, #7a4c24); border-top: 4px solid #4e2e14; box-shadow: inset 0 2px 0 rgba(255,225,160,.38); }
.tabs button { color: #f6e6bd; } .tabs button[aria-current="true"] { color: #ffd36a; }
.tabs button[aria-current="true"]::before { background: #ffd36a; }
.btn { box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.24); }
.btn.sec { background: var(--surface); }
.banner { box-shadow: inset 0 0 0 3px rgba(255,236,170,.4), inset 0 -4px 0 rgba(0,0,0,.2); }
.segs { border: 2px solid var(--wood); background: var(--surface); }
.segs button[aria-pressed="true"] { box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.2); }
.hint { border: 2px dashed var(--line); }
.lbl::before { background: var(--wood); }
.sprite, .crest, .icon, .portrait { image-rendering: pixelated; }
.pitch { border: 4px solid var(--wood2); box-shadow: 0 3px 0 var(--wood); }
.lv-stad { filter: saturate(1.08) sepia(.06); }


/* ===== v0.20: páginas internas em 32 bits ===== */
.banner { grid-template-columns: 56px minmax(0, 1fr) !important; min-height: 76px; }

/* ---------- textos da minha fala ---------- */

    case 'loanin': return `Quero levá-lo por ${f.dur} rodadas. Pago ${money(f.lfee)} de taxa e ${f.pct}% do salário${f.opt ? `, com opção de compra de ${money(f.opt)}` : ''}.`;
    case 'loanout': return `Posso ceder por ${f.dur} rodadas. Quero ${money(f.lfee)} de taxa e que vocês paguem ${f.pct}% do salário${f.opt ? `. Vocês teriam opção de compra de ${money(f.opt)}` : ''}.`;

}

/* ---------- ciclo da ligacao ---------- */

  document.documentElement.classList.add('cc-open');

}

  clearInterval(CC.clk); CC.clk = setInterval(() => { if (!CALL) return; CALL.sec = Math.floor((Date.now() - CALL.t0) / 1000); const el = document.getElementById('cc-stt'); if (el) el.textContent = ccTimer(CALL.sec); }, 1000);

}

    case 'agent': return ccPick([`Alô! Aqui é o ${c.partyName.split(' ')[0]}, empresário do ${ccShort(p.name)}. Pode apresentar a sua proposta.`, `Fala, professor! O ${ccShort(p.name)} está interessado no projeto. Vamos conversar de contrato.`], seed);
    case 'renew': return `Alô, professor. Sobre a renovação do ${ccShort(p.name)}: o que o clube tem a oferecer?`;
    case 'loanin': return `Alô, professor. Então o senhor quer o ${p.name} por empréstimo? Me diga as condições.`;
    case 'loanout': return `${clubOf(c.destId).name}, boa tarde. Soube que o senhor tem o ${p.name} para ceder. Quais as condições?`;
    case 'offer': return `Boa tarde, professor. Aqui é do ${clubOf(c.msg.payload.buyerId).name}. Queremos levar o ${p.name}. Oferecemos ${money(c.msg.payload.fee)} ${c.form.parc === 1 ? 'à vista' : `em ${c.form.parc} parcelas`}. O que o senhor acha?`;
    case 'board': return `Professor, bom dia. Vamos acertar as metas da temporada. Pela diretoria: ${ccS().board.txt0}. Copa do Brasil: oitavas.${estOfClub(S.userClubId) ? ' No estadual, chegar à final.' : ''} O que o senhor propõe?`;

}
function ccPlayerLine(c) {
  const m = c.msg, p = c.p, k = m.payload && m.payload.kind, n = p ? ccShort(p.name) : 'Ele';
  if (k === 'minutos') return `Professor, preciso falar com o senhor. Estou há muito tempo no banco e quero jogar mais. O que o senhor pensa para mim?`;
  if (k === 'sondagem') return `Professor, chegou uma sondagem de outro clube e eu fiquei pensando. Quero saber se o senhor conta comigo.`;
  if (k === 'elogio') return `Professor, queria agradecer a confiança. Estou jogando bem e quero continuar evoluindo.`;
  if (k === 'contrato') return `Professor, meu contrato está acabando e eu queria conversar sobre a renovação. O clube pensa em mim?`;

function ccSay(who, text, done) {
  const c = CALL; if (!c) return;
  c.sub = { who, text, n: 0, done };
  clearInterval(CC.tick);
  CC.tick = setInterval(() => {
    if (!CALL || !CALL.sub) { clearInterval(CC.tick); return; }
    const s = CALL.sub; s.n = Math.min(s.text.length, s.n + 2);
    const el = document.getElementById('cc-sub'); if (el) { el.textContent = s.text.slice(0, s.n); el.classList.toggle('cur', s.n < s.text.length); }
    if (s.n >= s.text.length) { clearInterval(CC.tick); const dn = s.done, cc = CALL; ccRenderCall(); if (dn) { cc.closing = true; setTimeout(() => { if (CALL === cc && cc.stage === 'live') dn(); }, 2600); } }

function ccSend() {

}

  c.sug = null; c.want = []; ccRenderCall();
}
function ccSugText(c) {

/* ---------- desfecho ---------- */
function ccEnd(c, kind, title, lines, extra) {

}

    const both = !!d.agent || p.clubId === 'free';
    const ln = `${money(f.fee)} ${f.parc === 1 ? 'à vista' : `em ${f.parc}x`}${f.swaps.length ? ` + ${f.swaps.length} jogador(es) na troca` : ''}.`;
    if (both) { const rc = ccCloseSigning(p); if (rc.ok) { ccEnd(c, 'ok', 'Contratação fechada', [ln, rc.msg, 'Ele já está no seu elenco.']); return; } ccEnd(c, 'ok', 'Acordo fechado, falta um detalhe', [ln, rc.msg], { close: p.id }); return; }

    if (both) { const rc = ccCloseSigning(p); if (rc.ok) { ccEnd(c, 'ok', 'Contratação fechada', [ln, rc.msg, 'Ele já está no seu elenco.']); return; } ccEnd(c, 'ok', 'Acordo fechado, falta um detalhe', [ln, rc.msg], { close: p.id }); return; }

  } else if (c.kind === 'loanout') {
    const r = ccStartLoanOut(p, c.destId, f); ccEnd(c, r.ok ? 'ok' : 'bad', r.ok ? 'Empréstimo fechado' : 'Empréstimo barrado', [r.msg]);

function ccClose() {

/* ---------- criacao de ligacoes ---------- */
function ccCall(kind, pid, extra) {
  if (CALL) return;
  const p = pid ? findPlayer(S, pid) : null;
  const base = { kind, p, pid };
  if (kind === 'buy' || kind === 'loanin') {
    const per = ccPerson('dir' + p.clubId, isClub(p.clubId) ? clubOf(p.clubId).color1 : '#555');
    Object.assign(base, { dir: 'out', partyName: per.name, partyShort: 'Diretor', partyRole: `Diretor de futebol · ${ccClubLabel(p)}`, av: ccAvPerson(per.look), coolKey: 'cl' + p.clubId + kind });
    if (kind === 'buy') base.form = ccS().deals[pid] && ccS().deals[pid].club ? { fee: ccS().deals[pid].club.fee, parc: ccS().deals[pid].club.parc, swaps: [...ccS().deals[pid].club.swaps] } : { fee: askPrice(S, p), parc: 1, swaps: [] };
    else base.form = ccLoanInDefaults(p);
  } else if (kind === 'agent' || kind === 'renew') {
    const per = ccPerson('ag' + p.id);
    Object.assign(base, { dir: 'out', partyName: per.name, partyShort: 'Agente', partyRole: `Agente de ${p.name}`, av: ccAvPerson(per.look), coolKey: 'ag' + p.id });
    const old = kind === 'agent' && ccS().deals[pid] && ccS().deals[pid].agent;
    base.form = old ? { ...old } : ccAgentDefaults(p, kind === 'renew' ? 'renew' : 'sign');
  } else if (kind === 'loanout') {
    const dest = extra.destId, per = ccPerson('dir' + dest, clubOf(dest).color1);
    Object.assign(base, { dir: 'out', destId: dest, partyName: per.name, partyShort: 'Diretor', partyRole: `Diretor de futebol · ${clubOf(dest).name}`, av: ccAvPerson(per.look), coolKey: 'cl' + dest + 'loanout', form: ccLoanOutDefaults(p) });
  } else if (kind === 'offer') {
    const m = extra.msg, buyer = m.payload.buyerId, per = ccPerson('dir' + buyer, clubOf(buyer).color1);
    Object.assign(base, { dir: extra.dir || 'in', msg: m, mid: m.id, partyName: per.name, partyShort: 'Diretor', partyRole: `Diretor de futebol · ${clubOf(buyer).name}`, av: ccAvPerson(per.look), coolKey: 'of' + m.id, form: { fee: m.payload.fee, parc: Math.min(ccOfferParc(m), ccMaxParc()) } });
  } else if (kind === 'board') {
    const b = ccBoardEnsure(); if (b.done) { say('As metas desta temporada já foram definidas.'); return; }
    const per = ccPerson('pres' + S.userClubId, clubOf(S.userClubId).color1);
    Object.assign(base, { dir: 'in', mid: 'board', partyName: per.name, partyShort: 'Presidente', partyRole: `Presidente · ${clubOf(S.userClubId).name}`, av: ccAvPerson(per.look), goals: { pos: b.pos0, cup: 1, est: estOfClub(S.userClubId) ? 1 : 0 } });
  }
  const cool = base.coolKey ? ccCoolLeft(base.coolKey) : 0;
  if (cool && (kind !== 'offer')) { say(`${base.partyName.split(' ')[0]} não atende agora. Tente de novo em ${cool} rodada${cool > 1 ? 's' : ''}.`); return; }
  if (extra && extra.stay) base.stay = true;
  ccOpen(base);
}

/* ---------- eventos do overlay ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-cc]'); if (!el || !CALL || el.disabled) return;
  const c = CALL, a = el.dataset.cc;
  if (c.closing && c.stage === 'live' && ['send', 'accept', 'refuse', 'bsend', 'popt', 'bstep', 'step', 'edit', 'sug'].includes(a)) return;
  switch (a) {
    case 'answer': ccAnswer(); break;
    case 'decline': { if (c.kind === 'offer' || c.kind === 'board') { ccMarkMissed(c.mid); } ccEnd(c, '', 'Chamada recusada', ['Você pode retornar depois pela Caixa de entrada.']); break; }
    case 'hang': { clearTimeout(c.timer); if (c.stage === 'dialing') { ccClose(); } else ccEnd(c, '', 'Chamada encerrada', c.kind === 'board' ? ['As metas ficam para depois. A diretoria ligará de novo.']  : ['Nada foi fechado nesta ligação.']); break; }
    case 'close': ccClose(); break;
    case 'edit': c.edit = el.dataset.k; c.editText = ''; ccRenderCall(); break;
    case 'step': c.edit = null; ccStep(c, el.dataset.k, Number(el.dataset.d)); ccRenderCall(); break;
    case 'role': c.form.role = el.dataset.v; ccRenderCall(); break;
    case 'swapopen': c.pick = true; ccRenderCall(); break;
    case 'swapclose': c.pick = false; ccRenderCall(); break;
    case 'swap': { const id = el.dataset.id, i = c.form.swaps.indexOf(id); if (i >= 0) c.form.swaps.splice(i, 1); else if (c.form.swaps.length < 3) c.form.swaps.push(id); ccRenderCall(); break; }
    case 'send': ccSend(); break;
    case 'sug': ccApplySug(); break;
    case 'accept': { if (c.busy) break; c.nSent++; c.log.push({ who: 'me', text: 'Aceito a oferta de vocês.' }); if (c.sub) { c.log.push({ who: c.partyShort, text: c.sub.text }); c.sub = null; } c.form = { fee: c.msg.payload.fee, parc: Math.min(ccOfferParc(c.msg), ccMaxParc()) }; ccConclude(c); break; }
    case 'refuse': { try { respond(S, c.mid, 'recusar'); } catch (er) {} ccEnd(c, 'bad', 'Oferta recusada', [`${clubOf(c.msg.payload.buyerId).name} foi informado.`]); break; }
    case 'bstep': { const k = el.dataset.k, mx = { pos: 20, cup: 3, est: 2 }[k], mn = k === 'pos' ? 1 : 0; c.goals[k] = Math.max(mn, Math.min(mx, c.goals[k] + (k === 'pos' ? -1 : 1) * Number(el.dataset.d))); ccRenderCall(); break; }
    case 'bsend': {
      const ev = ccBoardEval(c.goals);
      if (!ev.ok) { c.log.push({ who: 'me', text: 'Prefiro metas mais modestas.' }); ccSay('Presidente', 'Não dá, professor. Com esse elenco e esse investimento o clube espera mais do que isso.'); break; }
      c.answered = true; ccBoardApply(c.goals);
      const d = ev.d;
      ccSay('Presidente', d > 0 ? 'Gostei da postura! Fechado, e vou liberar uma verba extra para o senhor.' : d < 0 ? 'Tudo bem, professor, mas esperamos resultados.' : 'Combinado. Boa temporada!', () => ccEnd(c, 'ok', 'Metas definidas', [S.board.objText + '.', c.goals.cup ? CC_CUPG[c.goals.cup] + '.' : '', c.goals.est ? CC_ESTG[c.goals.est] + '.' : '', ev.bonus ? `Verba extra: ${money(ev.bonus)}.` : ''].filter(Boolean)));
      break;
    }
    case 'popt': {
      const r = respond(S, c.mid, el.dataset.v); c.answered = true; c.log.push({ who: 'me', text: (c.msg.options.find((o) => o.id === el.dataset.v) || { label: '…' }).label + '.' });
      ccSay(c.partyShort, r.note || 'Entendi, professor. Obrigado.', () => ccEnd(c, '', 'Conversa encerrada', []));
      break;
    }
    case 'renewfrom': { const pid = c.p.id, mid = c.mid; clearInterval(CC.tick); clearInterval(CC.clk); CALL = null; document.getElementById('call').innerHTML = ''; document.documentElement.classList.remove('cc-open'); try { respond(S, mid, 'depois'); } catch (er) {} ccCall('renew', pid, { stay: true }); break; }
    case 'closedeal': { const p = findPlayer(S, el.dataset.id); const r = ccCloseSigning(p); say(r.msg); if (r.ok) { sheet = null; } ccClose(); break; }
  }
});

/* ---------- avisos: "X esta ligando" ---------- */
function ccMarkMissed(mid) { const k = ccS().calls.find((x) => x.mid === mid); if (k) k.dismissed = true; }
function ccScan() {
  const c = ccS(), first = !c.init; c.init = true;
  try { ccBoardEnsure(); } catch (e) { console.error(e); }
  for (const m of [...S.messages].reverse()) {
    if (c.seen[m.id]) continue; c.seen[m.id] = 1;
    if (m.resolved) continue;
    const k = m.payload && m.payload.kind;
    if (k === 'proposta') {
      const p = findPlayer(S, m.playerId);
      if (!p || p.loan || p.clubId !== S.userClubId) { try { respond(S, m.id, 'recusar'); } catch (e) {} continue; }
      c.calls.push({ mid: m.id, t: 'offer' });
    } else if (!first && !m.read && !(m.payload && m.payload.cc) && m.cat !== 'olheiro') CC.texts.push({ mid: m.id, at: Date.now() });
  }
  c.calls = c.calls.filter((k) => { if (k.t === 'board') return !!c.board && !c.board.done && c.board.season === S.season; const m = S.messages.find((x) => x.id === k.mid); return m && !m.resolved; });
  if (Object.keys(c.seen).length > 400) { const ids = new Set(S.messages.map((m) => String(m.id))); for (const k of Object.keys(c.seen)) if (!ids.has(k)) delete c.seen[k]; }
}
const ccCaller = (k) => {
  if (k.t === 'board') return { name: 'Presidente', sub: 'Metas da temporada ' + S.season, av: icon('msgs') };
  const m = S.messages.find((x) => x.id === k.mid), p = findPlayer(S, m.playerId);
  if (k.t === 'offer') { const b = clubOf(m.payload.buyerId); return { name: b.name, sub: `Proposta por ${p ? p.name : 'jogador'} · ${money(m.payload.fee)}`, av: crest(m.payload.buyerId, 'm') }; }
  return { name: p ? p.name : m.from, sub: m.title, av: p ? ccAvPlayer(p) : icon('msgs') };
};
function syncNotif() {
  if (!S) return;
  const root = (() => { let el = document.getElementById('notif'); if (!el) { el = document.createElement('div'); el.id = 'notif'; document.body.appendChild(el); } return el; })();
  try { applyRealNames(); } catch (e) { console.error(e); }
  try { scTick(); } catch (e) { console.error(e); }
  try { galCheck(); galOpen(); } catch (e) { console.error(e); }
  try { ccScan(); } catch (e) { console.error(e); }
  if (CALL || live || loading.on || (S.coach && S.coach.fired)) { root.innerHTML = ''; return; }
  const c = ccS(), pend = c.calls.filter((k) => !k.dismissed), now = Date.now();
  CC.texts = CC.texts.filter((t) => now - t.at < 7000 && S.messages.some((m) => m.id === t.mid && !m.read));
  let html = '';
  if (pend.length) {
    const k = pend[0], cl = ccCaller(k);
    html += `<div class="nt call" role="alert"><div class="nt-av">${cl.av}</div><button class="nt-tx" data-act="cc_open" data-id="${k.mid}" aria-label="Abrir ligação de ${esc(cl.name)}"><span class="px">${k.t === 'offer' ? 'Time' : 'Diretoria'} ligando</span><b>${esc(cl.name)}</b><small>${esc(cl.sub)}</small></button><div class="nt-bt"><button class="nt-b no" data-act="cc_later" data-id="${k.mid}" aria-label="Deixar para depois">Depois</button><button class="nt-b nt-ic" data-act="cc_answer" data-id="${k.mid}" aria-label="Atender ligação de ${esc(cl.name)}">${ccIcon()}</button></div></div>`;
    if (pend.length > 1) html += `<span class="nt-more">+${pend.length - 1} ${pend.length > 2 ? 'ligações' : 'ligação'} na fila</span>`;
    if (!CC.rang[k.mid]) { CC.rang[k.mid] = 1; try { navigator.vibrate && navigator.vibrate([180, 90, 180, 90, 320]); } catch (e) {} }
  } else if (CC.texts.length && !(win && win.v === 'msgs')) {
    const t = CC.texts[0], m = S.messages.find((x) => x.id === t.mid), n = CC.texts.length;
    html += `<div class="nt msg" role="status"><div class="nt-av">${icon('msgs')}</div><div class="nt-tx"><span class="px">${n > 1 ? n + ' novas mensagens' : 'Nova mensagem'}</span><b>${esc(m.title)}</b><small>${esc(m.from)}</small></div><div class="nt-bt"><button class="nt-b" data-act="win" data-v="msgs">Ver</button></div></div>`;
    clearTimeout(CC.txtT); CC.txtT = setTimeout(() => { const r = document.getElementById('notif'); if (r && !r.querySelector('.call')) r.innerHTML = ''; }, 7000);
  }
  if (html !== CC.last) { root.innerHTML = html; CC.last = html; }
}

/* ---------- integracao com telas e acoes ---------- */
function ccMsgBtn(m) {
  const k = m.payload && m.payload.kind;
  if (k === 'board') { const b = ccS().board; return b && !b.done && b.season === S.season && m.payload.season === S.season ? `<button class="btn sm" style="margin:6px 0 4px" data-act="cc_msgcall" data-id="${m.id}">Ligar para o presidente</button>` : ''; }
  if (m.resolved || !m.options || !['proposta', 'contrato'].includes(k)) return '';
  return `<button class="btn sm" style="margin:6px 0 4px" data-act="cc_msgcall" data-id="${m.id}">${k === 'proposta' ? 'Retornar ligação do time' : 'Ligar para o agente'}</button>`;
}
function ccLoansCard() {
  const L = ccS().loans.filter((l) => findPlayer(S, l.pid));
  if (!L.length) return '';
  return `<div class="card tagc"><p class="lbl">Empréstimos</p>${L.map((l) => { const p = findPlayer(S, l.pid); return `<div class="ccloan"><div><b>${esc(p.name)}</b><small>${l.dir === 'in' ? `Emprestado do ${esc(l.clubName)}` : `Cedido ao ${esc(l.clubName)}`} · até a rodada ${l.endRound} · ${l.pct}% do salário ${l.dir === 'in' ? 'por mim' : 'por eles'}${l.opt ? ` · opção de compra ${money(l.opt)}${l.dir === 'out' ? ' (deles)' : ''}` : ''}</small></div><div style="display:flex;flex-direction:column;gap:6px">${l.dir === 'in' && l.opt ? `<button class="btn sm" style="width:auto;padding:10px 12px" data-act="cc_buyopt" data-id="${l.pid}">Comprar</button>` : ''}<button class="btn sec sm" style="width:auto;padding:10px 12px" data-act="cc_return" data-id="${l.pid}">Devolver</button></div></div>`; }).join('')}</div>`;
}
function ccPlayerExtra(p) {
  let h = '';
  if (p.role) h += `<div class="kv"><span class="muted">Papel combinado</span><b>${esc(ccRole(p.role).name)}</b></div>`;
  if (p.bn) h += `<div class="kv"><span class="muted">Bônus</span><b>${p.bn.a ? money(p.bn.a) + '/jogo' : ''}${p.bn.a && p.bn.g ? ' · ' : ''}${p.bn.g ? money(p.bn.g) + '/gol' : ''}</b></div>`;
  if (p.loan) h += `<div class="kv"><span class="muted">Empréstimo</span><b>do ${esc(p.loan.clubName)} até a rodada ${p.loan.endRound}</b></div><div class="btns" style="grid-template-columns:1fr"><button class="btn sec sm" data-act="cc_return" data-id="${p.id}">Devolver ao clube</button></div>`;
  if (p.loan && p.loan.dir === 'in' && p.loan.opt) h += `<div class="btns" style="grid-template-columns:1fr"><button class="btn sm" data-act="cc_buyopt" data-id="${p.id}">Exercer compra · ${money(p.loan.opt)}</button></div>`;
  else h += `<div class="btns" style="grid-template-columns:1fr"><button class="btn sec sm" data-act="cc_loanout" data-id="${p.id}">Emprestar a outro clube</button></div>`;
  return h;
}
function ccLoanOutSheet() {
  const p = myPlayer(sheet.id); if (!p) return '';
  const blk = ccLoanOutBlock(p), opts = blk ? [] : ccLoanOutOptions(p);
  return sh(`Emprestar ${esc(lastName(p.name))}`, `<p class="small muted">Escolha para quem ligar. Quem tem mais interesse paga melhor e aceita mais rápido.</p>
    ${blk ? `<p class="vd no">${esc(blk)}</p>` : ''}
    ${opts.map((o) => `<button class="cand" data-act="cc_loanto" data-id="${o.id}"><span class="pos">${crest(o.id, 's')}</span><span class="grow"><b>${esc(o.name)}</b><small>interesse ${o.interest} · reputação ${o.rep}</small></span>${ccIcon()}</button>`).join('') || (blk ? '' : '<p class="muted">Nenhum clube com interesse agora.</p>')}`);
}
function ccNegSheet() {
  const p = findPlayer(S, sheet.id); if (!p) return '';
  const v = view(S, p), free = p.clubId === 'free', inClub = isClub(p.clubId), d = ccDeal(p.id) || {};
  const origin = inClub ? clubOf(p.clubId).name : free ? 'Sem clube' : p.region || 'Exterior';
  const clubBlk = !free ? ccClubBlock(p) : null, loanBlk = ccLoanBlock(p), gen = !free && !windowOpen(S.round) ? 'A janela de transferências está fechada.' : null;
  const cool = (k) => ccCoolLeft(k);
  const cc = d.club, ag = d.agent, cCool = cool('cl' + p.clubId + 'buy'), aCool = cool('ag' + p.id);
  const row = (act, ok, title, sub, state, dis, cls) => `<button class="ccl ${ok ? 'ok' : ''} ${cls || ''}" data-act="${act}" data-id="${p.id}" ${dis ? 'disabled' : ''}><span class="ico">${ccIcon()}</span><span><b>${title}</b><small>${sub}</small></span><em>${state}</em></button>`;
  const clubSub = cc ? `${money(cc.fee)} ${cc.parc === 1 ? 'à vista' : `em ${cc.parc}x`}${cc.swaps.length ? ` + ${cc.swaps.length} na troca` : ''}` : `${esc(ccClubLabel(p))} · pedido ${money(askPrice(S, p))}`;
  const agSub = ag ? `${money(ag.wage)}/mês · ${ccYears(ag.years)}${ag.luvas ? ` · luvas ${money(ag.luvas)}` : ''} · ${ccRole(ag.role).name}` : `Salário, luvas, bônus, prazo e papel no elenco`;
  const ready = (free || !!cc) && !!ag, up = cc ? Math.round(cc.fee / cc.parc) : 0, lu = ag ? ag.luvas : 0;
  return sh(esc(p.name), `<div class="row" style="margin-bottom:10px">${face(p, 'lg', v.know < 1)}<div class="grow"><div class="small muted">${ptc(p.pos)} · ${p.age} anos · ${esc(origin)}</div></div><div style="text-align:right">${ov(v.ovr != null ? v.ovr : parseInt(v.ovrText) + 4, v.ovrText)}<div class="small muted">${v.pot != null ? 'pot ' + v.pot : v.potText}</div></div></div>
    ${v.know < 2 ? `<div class="hint">Atributos incompletos. ${S.staff.scouts.length ? '<button class="lnk" data-act="scoutsend" data-id="' + p.id + '">Enviar olheiro</button> para ver o jogador por inteiro.' : 'Contrate um olheiro (Mercado › Olheiros) para ver tudo.'}</div>` : ''}
    <p class="lbl" style="margin-top:6px">Negociação por telefone</p>
    <div class="ccd">
      ${free ? '<p class="small muted">Jogador livre: não há taxa de transferência. Só falta o agente.</p>' : row('cc_club', !!cc, 'Ligar para o clube', clubBlk ? esc(clubBlk) : clubSub, cc ? 'acordado' : cCool ? `ocupado ${cCool}r` : 'ligar', !!clubBlk || !!gen || !!cCool, cCool ? 'cool' : '')}
      ${row('cc_agent', !!ag, 'Ligar para o agente', agSub, ag ? 'acordado' : aCool ? `ocupado ${aCool}r` : 'ligar', !!gen && !free, aCool ? 'cool' : '')}
      ${!free ? row('cc_loanin', false, 'Pedir por empréstimo', loanBlk ? esc(loanBlk) : 'Taxa, duração e quanto do salário eu pago', loanBlk ? '' : 'ligar', !!loanBlk) : ''}
    </div>
    ${gen ? `<p class="vd no">${esc(gen)}</p>` : ''}
    ${ready ? `<div class="ccsum"><b>Resumo do acordo</b><br>${cc ? `Entrada hoje: <b>${money(up)}</b>${cc.parc > 1 ? ` + ${cc.parc - 1}x de ${money(up)}` : ''}<br>` : ''}${lu ? `Luvas: <b>${money(lu)}</b><br>` : ''}Salário: <b>+${money(ag.wage)}/mês</b> na folha<br>Caixa após assinar: <b>${money(S.finance.balance - up - lu)}</b></div>` : `<p class="small muted" style="margin-top:8px">${free ? 'Feche o contrato com o agente para contratar.' : 'Acerte com o clube e com o agente. A ordem é livre, mas o acordo vale por 3 rodadas.'}</p>`}
    <button class="btn" style="margin-top:12px" data-act="cc_close" data-id="${p.id}" ${ready ? '' : 'disabled'}>Fechar contratação</button>`);
}

function ccAct(a, el) {
  const id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'cc_club': ccCall('buy', id); return true;
    case 'cc_agent': ccCall('agent', id); return true;
    case 'cc_loanin': ccCall('loanin', id); return true;
    case 'cc_renewcall': ccCall('renew', id); return true;
    case 'cc_loanout': sheet = { kind: 'loanout', id }; return true;
    case 'cc_loanto': ccCall('loanout', sheet.id, { destId: id }); return true;
    case 'cc_close': { const p = findPlayer(S, id), r = ccCloseSigning(p); say(r.msg); if (r.ok) sheet = null; return true; }
    case 'cc_buyopt': { const l = ccS().loans.find((x) => x.pid === id); const r = l ? ccBuyOpt(l) : { ok: false, msg: 'Empréstimo não encontrado.' }; say(r.msg); if (r.ok) sheet = null; return true; }
    case 'cc_return': { const l = ccS().loans.find((x) => x.pid === id); if (l) { ccReturnLoan(l, true); say('Empréstimo encerrado.'); sheet = null; } return true; }
    case 'cc_answer': case 'cc_open': case 'cc_msgcall': {
      if (id === 'board') { const k2 = ccS().calls.find((x) => x.mid === 'board'); if (k2) k2.dismissed = true; ccCall('board', null, { stay: a !== 'cc_open' }); return true; }
      const m = S.messages.find((x) => x.id === Number(id) || (a === 'cc_msgcall' && String(x.id) === String(id))); if (!m || m.resolved) { if (m && m.payload && m.payload.kind === 'board') ccCall('board', null, { stay: true }); return true; }
      const k = m.payload && m.payload.kind, k2 = ccS().calls.find((x) => x.mid === m.id); if (k2) k2.dismissed = true;
      const ex = { msg: m, dir: 'in', stay: a !== 'cc_open' };
      if (k === 'proposta') ccCall('offer', m.playerId, ex);
      else if (k === 'contrato') { try { respond(S, m.id, 'depois'); } catch (er) {} ccCall('renew', m.playerId, { stay: true }); }
      else if (k === 'board') ccCall('board', null, { stay: true });
      return true;
    }
    case 'cc_later': { ccMarkMissed(Number(id)); return true; }
    case 'mkloan': mk.loan = v === '1'; if (mk.loan && (mk.src === 'free' || mk.src === 'ext')) mk.src = userDiv(S); return true;
    case 'release': case 'relgo': case 'renew': case 'rngo': case 'list': {
      const p = myPlayer(id); if (p && p.loan) { say('Jogador emprestado: use "Devolver ao clube".'); return true; }
      return false;
    }
  }
  return false;
}
ccEnsureRoot();

/* digitar valor especifico */
function ccCommitEdit(c) {
  const k = c.edit; if (!k) return; const n = ccParseMoney(c.editText || ''), def = ccStepDef(c, k);
  c.edit = null;
  if (n != null) c.form[k] = ccClamp(n, def.min, def.max != null ? def.max : 1e12); else if (c.editText) say('Não entendi o valor. Use por exemplo 450 mil ou 1,5 mi.');
  c.editText = ''; ccRenderCall();
}
document.addEventListener('input', (e) => { const el = e.target; if (el && el.classList && el.classList.contains('cc-ed') && CALL) CALL.editText = el.value; });
document.addEventListener('keydown', (e) => { const el = e.target; if (el && el.classList && el.classList.contains('cc-ed') && CALL) { if (e.key === 'Enter') { e.preventDefault(); CALL.editText = el.value; ccCommitEdit(CALL); } else if (e.key === 'Escape') { CALL.edit = null; ccRenderCall(); } } });
document.addEventListener('focusout', (e) => { const el = e.target; if (el && el.classList && el.classList.contains('cc-ed') && CALL && CALL.edit) { CALL.editText = el.value; setTimeout(() => { if (CALL && CALL.edit) ccCommitEdit(CALL); }, 0); } });

</script>
